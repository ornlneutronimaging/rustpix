[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "rustpix-gui"
version = "1.2.1"
description = "GUI application for rustpix pixel detector processing"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["neutron-imaging", "timepix", "tpx3", "pixel-detector", "GUI"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications",
  "Environment :: MacOS X :: Cocoa",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
homepage = "https://github.com/ornlneutronimaging/rustpix"
repository = "https://github.com/ornlneutronimaging/rustpix"

[tool.maturin]
bindings = "bin"
manifest-path = "Cargo.toml"
strip = true
